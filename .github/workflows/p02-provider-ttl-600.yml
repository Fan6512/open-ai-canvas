name: P-02 Provider TTL regression (Ubuntu)

on:
  push:
    branches:
      - validation/p02-provider-ttl-600
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    name: ${{ matrix.test }} — baseline and candidate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        test:
          - TestResourceAccessChecksOwnershipAndSignsOSSResource
          - TestPrepareResourceDeliverySignsPrivateQiniuCDNURL
          - TestResourceAccessBatchRejectsPrivateOriginForBrowserAccess
          - TestPrepareResourceDeliveryUsesSignedOriginWithoutCDN
    steps:
      - name: Checkout fixed baseline
        uses: actions/checkout@v4
        with:
          ref: d4dd8aa342c3145d463a204becc6b5d08b8e861e
          path: baseline
          fetch-depth: 1

      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: candidate
          fetch-depth: 1

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: candidate/backend/go.mod
          cache: true
          cache-dependency-path: |
            baseline/backend/go.sum
            candidate/backend/go.sum

      - name: Run fixed-baseline regression
        id: baseline
        working-directory: baseline/backend
        env:
          TEST_NAME: ${{ matrix.test }}
        shell: bash
        run: |
          set +e
          go test ./internal/app -run "^${TEST_NAME}$" -count=1 -v 2>&1 | tee "$RUNNER_TEMP/baseline-${TEST_NAME}.log"
          status=${PIPESTATUS[0]}
          echo "exit_code=${status}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Run candidate regression
        id: candidate
        if: always()
        working-directory: candidate/backend
        env:
          TEST_NAME: ${{ matrix.test }}
        shell: bash
        run: |
          set +e
          go test ./internal/app -run "^${TEST_NAME}$" -count=1 -v 2>&1 | tee "$RUNNER_TEMP/candidate-${TEST_NAME}.log"
          status=${PIPESTATUS[0]}
          echo "exit_code=${status}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Require both runs to pass
        if: always()
        env:
          BASELINE_STATUS: ${{ steps.baseline.outputs.exit_code }}
          CANDIDATE_STATUS: ${{ steps.candidate.outputs.exit_code }}
        run: |
          test "$BASELINE_STATUS" = "0"
          test "$CANDIDATE_STATUS" = "0"

      - name: Upload regression logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p02-${{ matrix.test }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/baseline-${{ matrix.test }}.log
            ${{ runner.temp }}/candidate-${{ matrix.test }}.log
          if-no-files-found: warn
          retention-days: 30

  ttl-focused:
    name: TTL defaults, overrides, signing and vet
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Test runtime-policy defaults and stored overrides
        working-directory: backend
        run: go test ./internal/platform -run '^TestAccessURLTTLDefaultsAndStoredOverrides$' -count=1 -v

      - name: Test storage normalization and signed URL windows
        working-directory: backend
        run: go test ./internal/storage -run '^(TestNormalizeAccessURLTTL|TestDirectSigningPathsAccessURLTTL)$' -count=1 -v

      - name: Test user and Provider resource-access TTL
        working-directory: backend
        run: go test ./internal/assets -run '^TestResolveAccessDefaultTTLAndAlignment$' -count=1 -v

      - name: Vet affected packages
        working-directory: backend
        run: go vet ./internal/platform ./internal/storage ./internal/assets ./internal/app
